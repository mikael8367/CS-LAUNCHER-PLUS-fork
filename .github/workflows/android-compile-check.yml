name: Android Gradle compile check

on:
  push:
    branches:
      - perf/low-memory-fps
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile Android and Java sources (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.3.13750724"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile project sources without packaging an APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :app_pojavlauncher:compileDebugSources \
            :forge_installer:compileJava \
            :arc_dns_injector:compileJava \
            :methods_injector_agent:compileJava \
            :jre_lwjgl3glfw:lwjgl-3.3.3:compileJava \
            :jre_lwjgl3glfw:lwjgl-3.4.1:compileJava \
            :jre_lwjgl3glfw:lwjgl-3.4.2:compileJava
